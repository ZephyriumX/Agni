name: ppg_camera
description: Native raw-frame PPG capture. Android Camera2 (Kotlin) and iOS AVFoundation (Swift): torch, exposure control, sensor timestamps, camera selection.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.agnipulse.ppg_camera
        pluginClass: PpgCameraPlugin
      ios:
        pluginClass: PpgCameraPlugin
